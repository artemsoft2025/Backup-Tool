[General]
# Базовая папка для хранения бэкапов
# Можно указать локальный путь или сетевой диск
backup_base = ~/backups

# Сколько хранить полных и инкрементальных бэкапов
max_full_backups = 4
max_incremental_backups = 7

# Хранить бэкапы N дней (0 - бессрочно)
max_age_days = 180

# Проверять целостность архива после создания
verify_archive = true

# Показывать прогресс-бар (для cron лучше false)
show_progress = true

# Режим отладки (подробный вывод; для раздачи оставьте false)
debug = false

# Размер для контрольной суммы (в байтах)
# 1048576 = 1 MB - оптимально для большинства случаев
hash_size = 1048576

# Максимальный размер файла для бэкапа (0 = без ограничений)
# 104857600 = 100 MB
# 1073741824 = 1 GB
max_file_size = 0

# Минимальное свободное место на диске (в байтах)
# 1073741824 = 1 GB
min_free_space = 1073741824

# Пропускать большие файлы (true) или только предупреждать (false)
skip_large_files = false

# Уровень сжатия (0-9, 6 - оптимально)
compression_level = 6

# Максимум файлов в инкрементальном бэкапе
# 0 = полный бэкап в день расписания при ЛЮБОМ изменении
# 50 = полный только при накоплении 50+ изменений, иначе инкремент
# Это же значение — аварийный переключатель: если в любой день
# изменений больше max_inc_files, делается полный бэкап
max_inc_files = 30

# ============================================
# РАЗДЕЛЕНИЕ НА ТОМА
# ============================================

# Максимальный размер тома в байтах (0 = без разделения)
# 1073741824 = 1 GB
# 2147483648 = 2 GB
max_volume_size = 0

# Префикс для томов
volume_prefix = part

# ============================================
# ЛОГИРОВАНИЕ
# ============================================

# Включить логирование
logging_enabled = true

# Путь к файлу лога
log_file = ~/logs/backup.log

# Уровень логирования: DEBUG, INFO, WARNING, ERROR
log_level = INFO

# Максимальный размер лога в байтах (0 = без ограничений)
log_max_size = 10485760  # 10 MB

# Сколько хранить старых логов
log_backup_count = 3

# ============================================
# ШИФРОВАНИЕ
# ============================================

# Включить шифрование AES-256
# Пароль можно указать здесь или в отдельном файле (безопаснее)
encryption_enabled = false

# Пароль для шифрования (оставьте пустым, если не используете)
encryption_password =

# Путь к файлу с паролем (безопаснее, чем хранить в конфиге)
# Создание: echo "ваш_пароль" > ~/.backup_password && chmod 600 ~/.backup_password
encryption_password_file =

# ============================================
# УМНОЕ РАСПИСАНИЕ
# ============================================

[Schedule]
# Режимы:
#   weekly   - по указанному дню недели полный (если изменений >= порога)
#   monthly  - в указанный день месяца полный (если изменений >= порога)
#   smart    - по понедельникам полный при накоплении изменений;
#              плюс полный принудительно, если полного нет или прошло >= 30 дней
#
# Порог изменений для полного в день расписания = max_inc_files
schedule_mode = smart

# Для weekly: день недели (1=пн, 2=вт, ..., 7=вс)
full_backup_day = 1

# Для monthly: день месяца (1-31, 0 = последний день)
full_backup_day_of_month = 1

# ============================================
# ФИЛЬТРЫ
# ============================================

[Include]
# Белый список - бэкапим ТОЛЬКО эти файлы
# Если пусто - бэкапим всё (кроме исключённого)
patterns =
    *.txt
    *.docx
    *.xlsx
    *.pptx
    *.pdf
    *.odt
    *.jpg
    *.jpeg
    *.png
    *.gif

[Exclude]
# Чёрный список - исключаем эти файлы (даже если в белом списке)
patterns =
    *.tmp
    *.log
    *.cache
    __pycache__
    .git
    *.bak
    Thumbs.db
    .DS_Store
    *.pyc
    *.pyo
    node_modules
    .venv
    venv
    .idea
    .vscode

# ============================================
# ПАПКИ ДЛЯ БЭКАПА
# ============================================

[Folders]
# Папки для бэкапа (каждая с новой строки)
# Пример:
#   paths =
#       ~/Документы
#       ~/Рабочий стол
paths =
    /mnt/s-share/home/отдел ИБ/Иванов/