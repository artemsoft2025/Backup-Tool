# ============================================
# ОБЩИЕ НАСТРОЙКИ (действуют на все профили)
# ============================================

[General]
# Базовая папка для хранения бэкапов.
# Каждый профиль хранится в подпапке: <backup_base>/<profile_name>/
# Например: /home/user/backups/docs/full/, /home/user/backups/photos/inc/
backup_base = ~/backups-test/

# Сколько хранить полных бэкапов (на профиль)
max_full_backups = 4

# Сколько хранить инкрементальных бэкапов (на профиль)
max_incremental_backups = 7

# Хранить бэкапы N дней (0 = бессрочно)
max_age_days = 180

# Проверять целостность архива после создания (testzip)
verify_archive = true

# Показывать прогресс-бар при архивации
show_progress = true

# Debug-режим (детальный вывод)
debug = false

# Размер для контрольной суммы (в байтах)
# 1048576 = 1 MB — хэшируем только первые 1 МБ файла
hash_size = 1048576

# Максимальный размер файла для бэкапа (0 = без ограничений)
max_file_size = 0

# Минимальное свободное место на диске с backup_base (в байтах)
# 1073741824 = 1 GB
min_free_space = 1073741824

# Пропускать большие файлы (true) или только предупреждать (false)
skip_large_files = false

# Уровень сжатия zip (0-9, 6 — оптимально)
compression_level = 6

# Максимум файлов в инкрементальном бэкапе (0 = без ограничений)
# Если превышен — автоматически делается полный бэкап
max_inc_files = 0

# Разделение на тома (0 = без разделения)
# 1073741824 = 1 GB, 2147483648 = 2 GB
max_volume_size = 0
volume_prefix = part

# Логирование
logging_enabled = true
log_file = ~/logs/backup.log
log_level = INFO
log_max_size = 10485760
log_backup_count = 3

# Шифрование (AES-256, нужен pyzipper: pip install pyzipper)
encryption_enabled = false
encryption_password =
encryption_password_file =

# ============================================================
# ХУК ПОСЛЕ СОЗДАНИЯ АРХИВА
# ============================================================
# Скрипт/программа, вызываемая после каждого успешно созданного архива.
# Пусто = отключено. Поддерживаются ~ и относительные пути.
#
# Скрипту передаются 4 аргумента:
#   $1 — полный путь к архиву
#   $2 — имя профиля
#   $3 — тип бэкапа: full или inc
#   $4 — размер архива в байтах
#
# Также доступны переменные окружения:
#   BACKUP_FILE, BACKUP_PROFILE, BACKUP_TYPE, BACKUP_SIZE
#
# Примеры:
#   post_backup_hook = ~/backup_tool/upload_hook.sh
#   post_backup_hook = C:\BackupTool\upload_hook.bat
#   post_backup_hook = rclone copy "%BACKUP_FILE%" yandex:Backups/%BACKUP_PROFILE%/%BACKUP_TYPE%/
post_backup_hook =

# Таймаут выполнения хука (сек). Если скрипт не успел — прерывается.
post_hook_timeout = 600

# ============================================
# РЕПЛИКАЦИЯ НА НОСИТЕЛИ С МЕТКОЙ
# ============================================

[Replication]
# Копировать ли архивы на носители с файлом-меткой BACKUP_TARGET
# false = только локальные копии
# true  = после создания архива копировать его на все найденные носители
enabled = true

# Имя файла-метки в корне носителя
# Создать метку: ./backup --init-target /media/user/USB
marker_name = BACKUP_TARGET

# ============================================
# РАСПИСАНИЕ
# ============================================

[Schedule]
# Режимы:
#   weekly  — по понедельникам полный (если есть изменения)
#   monthly — 1-го числа полный (если есть изменения)
#   smart   — раз в 30 дней + по понедельникам если есть изменения
schedule_mode = smart

# Для weekly/smart: день недели (1=пн, 2=вт, ..., 7=вс)
full_backup_day = 1

# Для monthly: день месяца (1-31)
full_backup_day_of_month = 1

# ============================================
# ФИЛЬТРЫ (общие для всех профилей)
# ============================================

[Include]
# Белый список — бэкапим ТОЛЬКО эти файлы.
# Если пусто — бэкапим всё (кроме Exclude).
patterns =
    *.txt
    *.docx
    *.xlsx
    *.pptx
    *.pdf
    *.odt
    *.jpg
    *.jpeg
    *.png
    *.gif

[Exclude]
# Чёрный список — исключаем эти файлы (даже если в белом списке)
patterns =
    *.tmp
    *.log
    *.cache
    __pycache__
    .git
    *.bak
    Thumbs.db
    .DS_Store
    *.pyc
    *.pyo
    node_modules
    .venv
    venv
    .idea
    .vscode

# ============================================
# ПРОФИЛИ
# ============================================
# Можно указать сколько угодно профилей.
# Каждый профиль хранится в своей подпапке <backup_base>/<имя>/.
# Если ни одного [Profile:*] нет, но есть [Folders] — создастся
# профиль "default" из секции [Folders].

[Profile:docs]
# Папки для бэкапа (каждая с новой строки)
paths =
    /mnt/s-share/home/Управление территориальной безопасности/отдел ИБ/Кашанин А.Н/


# ============================================
# ПРИМЕЧАНИЯ
# ============================================
#
# 1. Репликация:
#    - Включите [Replication] enabled = true
#    - Подключите флешку/внешний HDD
#    - Создайте на нём метку:
#        ./backup --init-target /media/$USER/USB
#      (на Windows: --init-target E:\ )
#    - Проверьте: ./backup6.py --list-targets
#    - Запустите бэкап: ./backup6.py
#    Архивы появятся и локально, и на носителе.
#
# 2. Структура на носителе:
#    <носитель>/BackupTool/<профиль>/full/2026-11-23_full.zip
#    <носитель>/BackupTool/<профиль>/inc/2026-11-23_inc_....zip
#
# 3. Носители БЕЗ метки не трогаются — защита от записи
#    на чужие флешки.
#
# 4. Если профиль без изменений в день полного бэкапа — создаётся
#    инкрементальный (или "Нет изменений"), полный не пересоздаётся.